<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="../css/var.css" />
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/darkmode.css">

  <link rel="stylesheet" href="../css/login.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />   
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>
    html, body{
        height: 100%;
      background: linear-gradient(to right, var(--color-primary-green), var(--color-primary-hover)) !important;
      display: flex;
      width: 100%;
      justify-content: center;
      align-items: center;
      color: #333333;
    }
</style>
</head>
<body>
    <div class="login-wrapper">
        <h2>Welcome Back</h2>
        <form>
          <input type="text" placeholder="Username" required />
          <input type="password" placeholder="Password" required />
          <!-- <button type="submit">Login</button> -->
           <a class="login" href="../dashboard/index.html" style="text-decoration: none;">Login</a>
        </form>
        <div class="signup-link">
            Not have account? <a href="register.html">Signup</a>
            </div>  
        <div class="footer">
          &copy; 2025 BiasaKeun
        </div>
      </div>
      <button class="dark-mode-toggle" id="darkToggle">
        <i class="fas fa-moon" id="toggleIcon"></i>
      </button>

      <script>
        const toggleButton = document.getElementById('darkToggle');
        const icon = document.getElementById('toggleIcon');
      
        // Cek preferensi dari localStorage saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
          const darkMode = localStorage.getItem('darkMode');
          if (darkMode === 'enabled') {
            document.body.classList.add('dark');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
          }
        });
      
        toggleButton.addEventListener('click', () => {
          document.body.classList.toggle('dark');
          const isDark = document.body.classList.contains('dark');
      
          if (isDark) {
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
            localStorage.setItem('darkMode', 'enabled');
          } else {
            icon.classList.remove('fa-sun');
            icon.classList.add('fa-moon');
            localStorage.setItem('darkMode', 'disabled');
          }
        });
      </script>

</body>
</html>
